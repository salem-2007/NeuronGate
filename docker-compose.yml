services:
  workers-ai2api:
    build: .
    image: workers-ai2api:latest
    container_name: workers-ai2api
    restart: unless-stopped
    # 该网络环境到 Cloudflare 的直连被墙。用 host 网络让容器共享宿主网络命名空间，
    # 从而复用宿主机的出网路径，无需在容器里单独配代理。
    network_mode: host
    environment:
      # 必填：管理员面板密码。不设则服务拒绝访问。
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-changeme}"
      # host 网络下直接监听宿主的该端口(ports 映射在 host 模式下被忽略)
      PORT: "8080"
      HOST: "0.0.0.0"
      KV_PATH: "/data/kv.json"
    volumes:
      # 配置持久化：CF 账号、API 密钥、模型映射都存这里
      - workers-ai2api-data:/data

volumes:
  workers-ai2api-data:
